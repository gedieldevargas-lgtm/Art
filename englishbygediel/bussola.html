@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&family=Space+Mono:wght@400;700&display=swap');

.bs{--ink:#0B0C0E;--ink2:#131417;--line:#25262B;--bone:#EDE8DE;--mut:#8A8D96;--faint:#5A5D66;
  --gold:#E4B363;--goldD:#A17F42;--rose:#D97D8A;
  min-height:100vh;background:radial-gradient(900px 520px at 50% -8%,#1A1B20 0%,transparent 62%),var(--ink);
  color:var(--bone);font-family:'Crimson Pro',Georgia,serif;padding:34px 20px 90px;}
.wrap{max-width:660px;margin:0 auto;}
.center{text-align:center;}
.eyebrow{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);}
.disp{font-family:'Cinzel',serif;font-weight:400;font-size:54px;letter-spacing:.16em;margin:16px 0 0;line-height:1;}
.disp.sm{font-size:32px;letter-spacing:.05em;margin:12px 0 10px;}
.tagline{font-style:italic;font-size:19px;color:var(--mut);margin:10px 0 0;}
.lead{font-size:17px;line-height:1.7;color:#C4C7CE;font-weight:300;margin:20px 0 26px;}
.lead strong{color:var(--gold);font-weight:400;}
.fine{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--faint);line-height:1.7;margin-top:14px;}

.vbox{position:relative;width:100%;padding-top:56.25%;border:1px solid var(--line);margin:22px 0;background:var(--ink2);}
.vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.vwrap{margin:22px 0;}
.vwrap .vbox{margin:0;}
.vcred{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);text-align:right;margin-top:6px;}

.lb{margin:0 0 26px;}
.lbdemo{opacity:.85;margin-bottom:6px;}
.lb.pulse .lb-fill{box-shadow:0 0 22px rgba(228,179,99,.75);}
.lb-track{position:relative;height:6px;background:var(--ink2);border:1px solid var(--line);}
.lb-fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--goldD),var(--gold));
  transition:width .7s cubic-bezier(.3,1,.3,1),box-shadow .3s;}
.lb-tick{position:absolute;top:-1px;bottom:-1px;width:1px;background:var(--ink);}
.lb-head{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:var(--gold);
  transform:translate(-50%,-50%);box-shadow:0 0 12px rgba(228,179,99,.9);transition:left .7s cubic-bezier(.3,1,.3,1);}
.lb-labels{display:flex;margin-top:8px;}
.lb-labels span{flex:1;text-align:center;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--faint);transition:.4s;}
.lb-labels .past{color:var(--goldD);}.lb-labels .on{color:var(--gold);font-weight:700;}
.lb-cap{font-style:italic;font-size:13px;color:var(--mut);text-align:center;margin-top:6px;}

.modules{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);margin:26px 0 28px;}
.mod{background:var(--ink2);padding:15px 18px;display:flex;gap:14px;align-items:baseline;animation:up .6s both;}
.mod .num{font-family:'Space Mono',monospace;font-size:10px;color:var(--gold);}
.mod strong{font-family:'Cinzel',serif;font-size:14px;font-weight:600;display:block;}
.mod span{font-size:15px;color:var(--mut);font-weight:300;}

.cta{display:block;width:100%;text-align:center;background:linear-gradient(180deg,#F0C87C,var(--gold));color:#0B0C0E;
  border:0;padding:16px;font-family:'Space Mono',monospace;font-weight:700;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;cursor:pointer;transition:.2s;text-decoration:none;}
.cta:hover{filter:brightness(1.08);transform:translateY(-1px);}
.cta:disabled{background:var(--ink2);color:var(--faint);cursor:not-allowed;transform:none;}

.head{display:flex;justify-content:space-between;align-items:center;gap:12px;}
.hright{display:flex;align-items:center;gap:10px;}
.badge{font-family:'Space Mono',monospace;font-size:10px;color:var(--mut);border:1px solid var(--line);padding:4px 9px;}
.ring{position:relative;width:36px;height:36px;color:var(--gold);flex-shrink:0;}
.ring svg{width:36px;height:36px;}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Space Mono',monospace;font-size:11px;color:currentColor;}
.ring.danger{color:var(--rose);animation:blink .8s infinite;}
.bar{height:1px;background:var(--line);margin:12px 0 22px;}
.bar span{display:block;height:1px;background:var(--gold);transition:width .5s;}

.q{font-family:'Cinzel',serif;font-size:23px;line-height:1.45;margin:6px 0 20px;}
.opts{display:grid;gap:7px;}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--ink2);border:1px solid var(--line);
  color:var(--bone);padding:14px 16px;font-family:'Crimson Pro',serif;font-size:17px;cursor:pointer;transition:.15s;animation:up .4s both;}
.opt:hover{border-color:var(--gold);background:#1A1B1F;transform:translateX(3px);}
.opt.hit{border-color:var(--gold);background:rgba(228,179,99,.14);}
.opt .k{font-family:'Space Mono',monospace;font-size:10px;color:var(--gold);border:1px solid var(--line);padding:2px 7px;}

.passage{background:var(--ink2);border-left:2px solid var(--gold);padding:20px;line-height:1.85;font-size:17px;
  font-weight:300;margin-bottom:22px;color:#D2D5DB;}
.hint{font-family:'Space Mono',monospace;font-size:11px;line-height:1.8;color:var(--mut);margin-bottom:16px;}
.hint strong{color:var(--gold);}

.play{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;background:transparent;
  border:1px dashed var(--goldD);color:var(--gold);padding:18px;font-family:'Space Mono',monospace;font-size:12px;
  letter-spacing:.1em;cursor:pointer;margin-bottom:22px;transition:.2s;}
.play:hover{background:rgba(228,179,99,.06);}
.play:disabled{border-color:var(--line);color:var(--faint);cursor:not-allowed;}
.wave{display:flex;align-items:center;gap:3px;height:16px;}
.wave i{width:2px;height:5px;background:currentColor;display:block;}
.play.live .wave i{animation:w .7s infinite ease-in-out;}
@keyframes w{0%,100%{height:4px}50%{height:16px}}

.prompt{font-family:'Cinzel',serif;font-size:19px;line-height:1.55;border-left:2px solid var(--gold);padding-left:16px;margin-bottom:16px;}
.ta{width:100%;background:var(--ink2);border:1px solid var(--line);color:var(--bone);padding:16px;font-size:17px;
  line-height:1.7;font-family:'Crimson Pro',serif;resize:vertical;box-sizing:border-box;}
.ta:focus{outline:1px solid var(--gold);}
.count{display:flex;align-items:center;gap:10px;font-family:'Space Mono',monospace;font-size:10px;color:var(--mut);margin:10px 0 24px;}
.count em{color:var(--gold);font-style:normal;}
.cbar{flex:0 0 90px;height:2px;background:var(--line);}
.cbar i{display:block;height:2px;background:var(--gold);transition:width .3s;}

.speak{border:1px solid var(--line);padding:18px;margin-bottom:24px;}
.sh{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.sh strong{font-family:'Cinzel',serif;font-size:14px;}
.sh span{font-size:15px;color:var(--mut);font-weight:300;}
.tagop{font-family:'Space Mono',monospace;font-size:9px;color:var(--gold);letter-spacing:.14em;margin-left:6px;}
.mic{width:100%;background:var(--ink2);border:1px solid var(--line);color:var(--bone);padding:14px;cursor:pointer;
  font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;}
.mic.live{border-color:var(--rose);color:var(--rose);animation:blink 1.2s infinite;}
@keyframes blink{50%{opacity:.55}}
.trans{margin-top:12px;font-size:16px;color:#C4C7CE;font-style:italic;line-height:1.6;}
.mic.big{padding:20px;font-size:13px;margin-bottom:6px;}
.transbox{border:1px solid var(--line);padding:16px;margin:14px 0;}
.tlabel{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:8px;}
.twc{font-family:'Space Mono',monospace;font-size:10px;color:var(--gold);margin-top:10px;}
.skip{display:block;width:100%;background:none;border:0;color:var(--faint);font-family:'Space Mono',monospace;
  font-size:10px;letter-spacing:.1em;cursor:pointer;margin-top:12px;padding:8px;}
.skip:hover{color:var(--mut);}
.scenewrap{margin:8px 0 20px;border:1px solid var(--line);background:var(--ink2);padding:10px;}
.scenewrap.shake{animation:shk .4s;}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.scene{width:100%;display:block;}
.hz .hzbox{transition:.2s;}
.hz:hover .hzbox{stroke:var(--gold)!important;stroke-opacity:.4;}
.hz.done .hzbox{stroke:var(--gold)!important;}
.scq{display:flex;align-items:center;gap:14px;}
.scn{font-family:'Space Mono',monospace;font-size:11px;color:var(--gold);border:1px solid var(--line);padding:4px 8px;flex-shrink:0;}
.scq .q{margin:0;}

.fields{display:grid;gap:8px;margin:24px 0 16px;}
.in{background:var(--ink2);border:1px solid var(--line);color:var(--bone);padding:15px;font-size:17px;
  font-family:'Crimson Pro',serif;box-sizing:border-box;width:100%;}
.in:focus{outline:1px solid var(--gold);}

.orb{position:relative;width:70px;height:70px;margin:64px auto 8px;}
.orb i{position:absolute;inset:0;border:1px solid var(--gold);border-radius:50%;animation:o 2s infinite ease-out;}
.orb i:nth-child(2){animation-delay:.66s}.orb i:nth-child(3){animation-delay:1.33s}
@keyframes o{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1);opacity:0}}

.verd{display:flex;gap:22px;align-items:flex-start;border:1px solid var(--line);background:var(--ink2);padding:24px;margin:16px 0 22px;}
.vl{font-family:'Cinzel',serif;font-size:58px;line-height:.9;color:var(--gold);}
.verd strong{font-family:'Cinzel',serif;font-size:15px;display:block;margin-bottom:6px;}
.verd p{font-size:16px;color:#C4C7CE;line-height:1.6;font-weight:300;margin:0 0 8px;}
.conf{font-family:'Space Mono',monospace;font-size:9px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;}
.veredito{font-family:'Cinzel',serif;font-size:21px;line-height:1.5;margin:8px 0 32px;}

.sec{margin-bottom:34px;}
.sech{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);
  font-weight:400;border-bottom:1px solid var(--line);padding-bottom:10px;margin:0 0 18px;}

.gauge{max-width:280px;margin:0 auto;}
.gauge svg{width:100%;overflow:visible;}
.gv{font-family:'Cinzel',serif;font-size:36px;fill:var(--bone);}
.glabels{display:flex;justify-content:space-between;font-family:'Space Mono',monospace;font-size:9px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:-4px;}

.radar{width:100%;max-width:320px;display:block;margin:0 auto 20px;overflow:visible;}
.rlab{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;}
.bars{display:grid;gap:11px;}
.brow{display:grid;grid-template-columns:118px 1fr 34px;align-items:center;gap:12px;}
.bn{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--bone);}
.bn em{display:block;font-style:italic;font-family:'Crimson Pro',serif;font-size:12px;color:var(--faint);text-transform:none;letter-spacing:0;}
.btrack{height:5px;background:var(--ink2);border:1px solid var(--line);}
.btrack i{display:block;height:100%;width:0;transition:width 1.1s cubic-bezier(.2,.9,.25,1);}
.bv{font-family:'Space Mono',monospace;font-size:11px;text-align:right;font-weight:700;}
.gap{font-size:16px;line-height:1.7;color:#C4C7CE;font-weight:300;margin-top:18px;border-top:1px solid var(--line);padding-top:16px;}

.bul,.ord{margin:0;padding-left:18px;}
.bul li,.ord li{font-size:17px;line-height:1.7;color:#C4C7CE;margin-bottom:10px;font-weight:300;animation:up .6s both;}
.trava{border-left:2px solid var(--rose);padding-left:14px;margin-bottom:18px;animation:up .6s both;}
.trava strong{font-family:'Cinzel',serif;font-size:14px;display:block;margin-bottom:6px;}
.ev{font-style:italic;font-size:17px;color:var(--mut);margin:0 0 6px;}
.cu{font-size:16px;color:#C4C7CE;margin:0;line-height:1.6;font-weight:300;}

.tbl{width:100%;border-collapse:collapse;font-size:15px;}
.tbl th{text-align:left;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);padding:8px;border-bottom:1px solid var(--line);font-weight:400;}
.tbl td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55;color:#C4C7CE;font-weight:300;}
.er{color:#D98B8B;}.ce{color:var(--gold);}

.score{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);}
.score div{background:var(--ink2);padding:16px;text-align:center;}
.score span{display:block;font-family:'Space Mono',monospace;font-size:9px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;}
.score strong{font-family:'Cinzel',serif;font-size:24px;color:var(--gold);}

.close{border-top:1px solid var(--line);padding-top:30px;text-align:center;}
.close h3{font-family:'Cinzel',serif;font-size:25px;line-height:1.4;margin:0 0 12px;font-weight:400;}
.close p{font-size:16px;color:var(--mut);line-height:1.6;margin:0 0 22px;font-weight:300;}

.acheck{margin-top:26px;border-top:1px solid var(--line);padding-top:16px;}
.acbtn{background:none;border:0;color:var(--faint);font-family:'Space Mono',monospace;font-size:10px;
  letter-spacing:.1em;cursor:pointer;padding:0;}
.acbtn:hover{color:var(--gold);}
.aclist{margin-top:14px;display:grid;gap:8px;}
.acnote{font-family:'Space Mono',monospace;font-size:10px;color:var(--mut);line-height:1.7;margin:0 0 6px;}
.acrow{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:10px;}
.acplay{background:var(--ink2);border:1px solid var(--line);color:var(--gold);font-family:'Space Mono',monospace;
  font-size:10px;padding:6px 10px;cursor:pointer;white-space:nowrap;}
.acplay:hover{border-color:var(--gold);}
.aclvl{font-family:'Space Mono',monospace;font-size:10px;color:var(--gold);border:1px solid var(--line);padding:2px 6px;}
.actxt{font-size:13px;color:#C4C7CE;font-weight:300;line-height:1.4;}
.acst{font-family:'Space Mono',monospace;font-size:9px;color:var(--mut);white-space:nowrap;}
.aerr{font-family:'Space Mono',monospace;font-size:11px;color:var(--rose);text-align:center;margin:-12px 0 18px;line-height:1.5;}
.fotobox{position:relative;border:1px solid var(--line);background:var(--ink2);margin:0 0 20px;cursor:zoom-in;overflow:hidden;}
.fotobox img{width:100%;display:block;max-height:340px;object-fit:cover;object-position:center 35%;transition:.3s;}
.fotobox.zoom{cursor:zoom-out;}
.fotobox.zoom img{max-height:none;object-fit:contain;}
.fzoom{position:absolute;bottom:8px;right:8px;background:rgba(11,12,14,.85);color:var(--gold);
  font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border:1px solid var(--line);}
.nsei{display:block;width:100%;background:none;border:1px dashed var(--line);color:var(--faint);
  font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.08em;cursor:pointer;margin-top:10px;padding:11px;transition:.2s;}
.nsei:hover{border-color:var(--mut);color:var(--mut);}
.confwarn{border:1px solid var(--rose);border-left-width:3px;padding:16px;margin:0 0 22px;background:rgba(217,125,138,.06);}
.confwarn strong{display:block;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--rose);margin-bottom:8px;}
.confwarn p{margin:0;font-size:15px;line-height:1.6;color:#C4C7CE;font-weight:300;}

.fade{animation:fi .7s both;}
.slide{animation:up .45s both;}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:520px){.disp{font-size:38px}.q{font-size:20px}.verd{flex-direction:column;gap:10px}
  .brow{grid-template-columns:96px 1fr 30px;gap:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
