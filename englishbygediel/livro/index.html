<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Prévia · Livro da aula</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="livro.css?v=1">
<style>
:root{--bg:#f0f2f8;--surface:#fff;--surface2:#f5f6fb;--border:#e8eaf2;--fg:#111827;--fg2:#6b7280;--fg3:#9ca3af;--accent:#4f6ef7;--accent2:#8b5cf6;--gold:#f59e0b;--green:#10b981;--red:#ef4444}
:root[data-theme="dark"]{--bg:#0f1117;--surface:#1e2028;--surface2:#252730;--border:#2e3040;--fg:#f1f3fb;--fg2:#8892a4;--fg3:#5a6275;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:18px}
.kick{font-size:11px;color:var(--fg3);font-weight:700;letter-spacing:.5px;margin-bottom:4px}
.tt{font-size:21px;font-weight:800;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.tt button{font:inherit;font-size:12px;border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:9px;padding:6px 10px;cursor:pointer}
.player-wrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000}
.player-wrap .fake{position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-align:center;background:radial-gradient(80% 80% at 70% 20%,#3b2a8f,#0d0b16)}
.player-wrap .fake b{font-size:46px;display:block}
.abaixo{margin-top:14px;padding:14px;border:1px dashed var(--border);border-radius:14px;color:var(--fg2);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="kick">PRÉVIA · COMO O ALUNO VÊ A AULA</div>
  <div class="tt"><span id="tit">Livro da aula</span><button onclick="var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'">🌓 Tema</button></div>
  <div class="aula-grid">
    <div class="aula-video"><div class="player-wrap"><div class="fake"><div><b>▶</b>Vídeo da aula (YouTube)</div></div></div>
      <div class="abaixo">Aqui embaixo continuam as reações, a descrição, o quiz e os comentários, como já é hoje.</div></div>
    <aside class="aula-livro" id="aula-livro"></aside>
  </div>
</div>
<script src="livro.js?v=1"></script>
<script>
var id=new URLSearchParams(location.search).get('u')||'unit-01';
Livro.abrir(document.getElementById('aula-livro'),id);
setTimeout(function(){var a=(window.LIVRO_AULAS||{})[id];if(a)document.getElementById('tit').textContent='Unit '+a.unidade+' · '+a.titulo;},400);
</script>
</body>
</html>
