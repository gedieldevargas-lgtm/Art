<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadastro · Maratona 10 meses</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a1426">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1426;--card:#111d34;--card2:#16243f;--linha:rgba(255,255,255,.09);--marfim:#f4ede4;--dim:#a9b3c7;--cobre:#d6965a;--cobre2:#e9b98a;--verde:#22c55e;--azul:#3b82f6}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--marfim);font:400 15px/1.55 Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;min-height:100vh;padding-bottom:40px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;max-width:880px;margin:0 auto}
.topo a{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:99px;background:rgba(255,255,255,.08);text-decoration:none;font-weight:600;font-size:14px}
.marca{font-weight:700;letter-spacing:-.02em}.marca b{color:var(--cobre2)}
body.embed .topo{display:none}
.hero{max-width:880px;margin:0 auto;padding:18px 18px 8px}
.hero small{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cobre2);font-weight:700}
.hero h1{font-size:clamp(38px,8vw,64px);line-height:.98;margin:8px 0 12px}
.hero h1 em{color:var(--cobre2)}
.hero p{color:var(--dim);max-width:52ch}
.legenda{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.lista{max-width:880px;margin:18px auto 0;padding:0 18px;display:grid;gap:14px;position:relative}
.mara{position:relative;display:grid;grid-template-columns:120px 1fr;gap:0;background:var(--card);border:1px solid var(--linha);border-radius:22px;overflow:hidden;transition:transform .2s,border-color .2s}
.mara:hover{border-color:rgba(255,255,255,.18)}
.mara .arte{position:relative;background:var(--card2) center/cover no-repeat;min-height:100%}
.mara .arte:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 40%,var(--card))}
.mara .arte span{position:absolute;left:12px;top:12px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:rgba(10,20,38,.72);backdrop-filter:blur(8px);z-index:1}
.mara .corpo{padding:18px 18px 18px 6px}
.mara .linha1{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.mara h2{font-size:28px;line-height:1.02}
.mara .ed{font-size:12px;color:var(--dim);font-weight:600}
.mara .quando{font-size:13px;font-weight:700;color:var(--cor,var(--cobre2));margin-bottom:6px}
.mara p{color:var(--dim);font-size:14px}
.mara p b{color:var(--marfim);font-weight:600}
.mara .acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.mara .aviso{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);font-size:13px;color:var(--dim)}
.mara.fechada .arte{filter:saturate(.6)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.abertas{background:rgba(34,197,94,.14);color:#4ade80}
.pill.abertas i{animation:pisca 1.4s infinite}
.pill.andamento{background:rgba(214,150,90,.16);color:var(--cobre2)}
.pill.em-breve{background:rgba(59,130,246,.16);color:#93c5fd}
.pill.encerrada{background:rgba(255,255,255,.08);color:var(--dim)}
.pill.dias{background:rgba(255,255,255,.07);color:var(--marfim);font-weight:600}
@keyframes pisca{50%{opacity:.25}}
.b1,.b2{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:12px 20px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .15s,filter .15s}
.b1{background:#fff;color:#0a1426}.b1:hover{filter:brightness(.92)}
.b2{background:rgba(255,255,255,.1);color:#fff}.b2:hover{background:rgba(255,255,255,.18)}
.b1:active,.b2:active{transform:scale(.96)}
.b1:disabled{opacity:.5;cursor:progress}
.zap{background:#25d366!important;color:#fff!important}
/* folha do formulário */
.ov{position:fixed;inset:0;z-index:50;background:rgba(4,8,18,.66);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.folha{background:var(--card);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px 28px;border:1px solid var(--linha);animation:sobe .28s cubic-bezier(.22,1,.36,1)}
@media (min-width:640px){.ov{align-items:center}.folha{border-radius:24px}}
@keyframes sobe{from{transform:translateY(40px);opacity:0}}
.folha .cab{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:6px}
.folha h3{font-size:30px;line-height:1.02}
.folha .x{border:0;background:rgba(255,255,255,.08);width:36px;height:36px;border-radius:50%;cursor:pointer;flex:none}
.folha .sub{color:var(--dim);font-size:13.5px;margin-bottom:16px}
.grupo{margin:16px 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cobre2);font-weight:800}
.campo{display:block;margin-bottom:12px}
.campo>span{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.campo>span em{font-style:normal;color:var(--dim);font-weight:400}
.campo input,.campo select,.campo textarea{width:100%;background:var(--card2);border:1px solid var(--linha);border-radius:12px;padding:12px 13px;font-size:15px;outline:none}
.campo textarea{min-height:76px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--cobre)}
.ops{display:flex;flex-wrap:wrap;gap:7px}
.ops label{cursor:pointer}
.ops input{position:absolute;opacity:0;pointer-events:none}
.ops span{display:inline-block;padding:9px 13px;border-radius:99px;background:var(--card2);border:1px solid var(--linha);font-size:13.5px;transition:background .15s}
.ops input:checked+span{background:#fff;color:#0a1426;border-color:#fff;font-weight:700}
.ops input:focus-visible+span{outline:2px solid var(--cobre)}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.dois{grid-template-columns:1fr}.mara{grid-template-columns:1fr}.mara .arte{height:120px}.mara .arte:after{background:linear-gradient(180deg,transparent 30%,var(--card))}.mara .corpo{padding:4px 16px 18px}}
.aceite{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--dim);margin:6px 0 16px}
.aceite input{margin-top:3px;accent-color:var(--cobre)}
.erro{color:#fca5a5;font-size:13px;min-height:18px;margin-bottom:8px}
.ok{text-align:center;padding:10px 4px}
.ok .gr{font-size:52px}
.ok h3{margin:6px 0 8px}
.ok p{color:var(--dim);margin-bottom:16px}
.ok .acoes{display:grid;gap:8px}
.rodape{max-width:880px;margin:26px auto 0;padding:0 18px;color:var(--dim);font-size:12.5px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>.caixa{max-width:560px;margin:0 auto;padding:0 18px}.caixa .folha{animation:none;border-radius:24px;max-height:none}</style>
</head>
<body>
<header class="topo"><span class="marca">english<b>by</b>gediel</span></header>
<section class="hero" style="max-width:560px">
  <small>Maratona 10 meses · Turma Fundadora</small>
  <h1 class="serif">Seu acesso <em>em 1 minuto</em></h1>
  <p>Crie sua conta na Plataforma Inteligente. Ela já nasce com o seu plano e com o menu exclusivo da maratona liberado.</p>
</section>
<main class="caixa"><div class="folha" id="folha"><p class="sub">Conferindo o link…</p></div></main>
<script src="maratonas.js"></script>
<script>
(function () {
  var MR = window.EBG_MARATONAS, $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var codigo = new URLSearchParams(location.search).get('c') || '';
  var ops = function (n, l, t) { return '<div class="ops">' + l.map(function (o) { return '<label><input type="' + (t || 'radio') + '" name="' + n + '" value="' + esc(o) + '"><span>' + esc(o) + '</span></label>'; }).join('') + '</div>'; };
  var api = function (corpo) { return fetch('/.netlify/functions/maratona-cadastro', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) }).then(function (r) { return r.json().then(function (j) { j._ok = r.ok; return j; }); }); };
  function erroLink(t) { $('#folha').innerHTML = '<div class="ok"><div class="gr">🔒</div><h3 class="serif">Link inválido</h3><p>' + esc(t) + '</p></div>'; }
  if (!codigo) return erroLink('Use o link que o Gediel mandou no grupo da maratona.');
  api({ codigo: codigo, so_checar: true }).then(function (r) { if (!r._ok) return erroLink(r.erro || 'Link inválido.'); form(r.turma); }).catch(function () { erroLink('Sem conexão. Tente de novo.'); });
  function form(turma) {
    var C = MR.comuns;
    $('#folha').innerHTML = '<form id="f" novalidate>'
      + '<div class="grupo">Sua conta</div>'
      + '<label class="campo"><span>Nome completo</span><input name="nome" required maxlength="120" autocomplete="name"></label>'
      + '<label class="campo"><span>E-mail (vai ser o seu login)</span><input name="email" type="email" required maxlength="160" autocomplete="email"></label>'
      + '<label class="campo"><span>Crie uma senha <em>(mínimo 6)</em></span><input name="senha" type="password" required minlength="6" autocomplete="new-password"></label>'
      + '<div class="dois"><label class="campo"><span>WhatsApp com DDD</span><input name="whatsapp" inputmode="tel" maxlength="30"></label><label class="campo"><span>Instagram <em>(opcional)</em></span><input name="instagram" maxlength="80"></label></div>'
      + '<div class="dois"><label class="campo"><span>Cidade</span><input name="cidade" maxlength="120"></label><label class="campo"><span>País</span><input name="pais" value="Brasil" maxlength="80"></label></div>'
      + '<label class="campo"><span>Profissão <em>(opcional)</em></span><input name="profissao" maxlength="120"></label>'
      + '<div class="grupo">Seu inglês</div>'
      + '<div class="campo"><span>Seu nível hoje</span>' + ops('nivel', C.nivel) + '</div>'
      + '<div class="campo"><span>Pra que você quer o inglês?</span>' + ops('objetivo', C.objetivo, 'checkbox') + '</div>'
      + '<div class="campo"><span>Que horário você mais usa?</span>' + ops('turno', C.turno, 'checkbox') + '</div>'
      + '<p class="erro" id="erro" role="alert"></p><button class="b1" type="submit" style="width:100%;padding:15px">Criar meu acesso</button></form>';
  }
  var um = function (f, n) { var e = f.querySelector('[name="' + n + '"]:checked'); return e ? e.value : ''; };
  var varios = function (f, n) { return [].map.call(f.querySelectorAll('[name="' + n + '"]:checked'), function (x) { return x.value; }).join(', '); };
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'f') return; e.preventDefault();
    var f = e.target, er = $('#erro');
    if (f.nome.value.trim().length < 2) { er.textContent = 'Escreva o seu nome.'; return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.value.trim())) { er.textContent = 'Confira o e-mail.'; return; }
    if (f.senha.value.length < 6) { er.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; return; }
    var bt = f.querySelector('[type=submit]'); bt.disabled = true; bt.textContent = 'Criando…'; er.textContent = '';
    api({ codigo: codigo, nome: f.nome.value, email: f.email.value, senha: f.senha.value, whatsapp: f.whatsapp.value.replace(/\D/g, ''), instagram: f.instagram.value.replace(/^@/, ''),
      cidade: f.cidade.value, pais: f.pais.value, profissao: f.profissao.value, nivel: um(f, 'nivel'), objetivo: varios(f, 'objetivo'), turno: varios(f, 'turno') })
      .then(function (r) {
        if (!r._ok) { er.textContent = r.erro || 'Algo deu errado.'; bt.disabled = false; bt.textContent = 'Criar meu acesso'; return; }
        $('#folha').innerHTML = '<div class="ok"><div class="gr">🏁</div><h3 class="serif" style="font-size:34px">Você está dentro!</h3>'
          + '<p>' + (r.existia ? 'Você já tinha conta: juntei os seus dados e liberei a maratona. Entre com a <b>senha que você já usava</b>.' : 'Sua conta foi criada. Entre com o e-mail e a senha que você acabou de escolher.') + '</p>'
          + '<p>Primeiros passos lá dentro: teste de nível, Prisma, tutorial dos menus e as primeiras aulas. Isso libera o seu checklist da maratona.</p>'
          + '<div class="acoes"><a class="b1" href="membros.html">Entrar na plataforma</a></div></div>';
      }).catch(function () { er.textContent = 'Sem conexão. Tente de novo.'; bt.disabled = false; bt.textContent = 'Criar meu acesso'; });
  });
})();
</script>
</body>
</html>
