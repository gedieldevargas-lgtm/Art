<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Seu acesso · English by Gediel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',-apple-system,system-ui,sans-serif;color:#fff;background:#0b0d1c;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px max(18px,env(safe-area-inset-left));-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;overflow:hidden;z-index:-1}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35}
.bg i:nth-child(1){width:340px;height:340px;background:#4f6ef7;top:-100px;right:-80px}
.bg i:nth-child(2){width:300px;height:300px;background:#d6965a;bottom:-90px;left:-80px;opacity:.28}
.card{width:100%;max-width:440px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:26px;padding:30px 24px;backdrop-filter:blur(10px)}
.k{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;opacity:.65;text-align:center}
h1{font-size:clamp(25px,6vw,31px);line-height:1.15;text-align:center;margin:10px 0 8px;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(90deg,#fff,#f2c69c);-webkit-background-clip:text;background-clip:text;color:transparent}
p.s{font-size:14px;opacity:.75;text-align:center;line-height:1.55;margin:0 auto 20px}
.plano{display:flex;justify-content:center;margin-bottom:18px}
.plano span{background:#fff;color:#1b1f4b;font-weight:800;font-size:13px;border-radius:99px;padding:7px 16px}
label{display:block;font-size:12px;font-weight:700;opacity:.8;margin:12px 4px 6px}
input{width:100%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16);border-radius:14px;padding:15px 16px;font:inherit;font-size:16px;font-weight:600;color:#fff;outline:none}
input:focus{border-color:#fff;background:rgba(255,255,255,.12)}
input::placeholder{color:rgba(255,255,255,.35);font-weight:500}
button{width:100%;margin-top:20px;background:#fff;color:#1b1f4b;border:0;border-radius:16px;padding:16px;font:inherit;font-size:16px;font-weight:800;cursor:pointer}
button:disabled{opacity:.5}
.erro{min-height:20px;text-align:center;color:#fca5a5;font-size:13px;font-weight:600;margin-top:12px}
.ok{text-align:center}.ok .big{font-size:54px;margin-bottom:6px}
a.go{display:block;text-decoration:none;text-align:center;margin-top:20px;background:#fff;color:#1b1f4b;border-radius:16px;padding:16px;font-weight:800}
</style>
</head>
<body>
<div class="bg"><i></i><i></i></div>
<main class="card" id="box"><p class="s">Conferindo o seu convite…</p></main>
<script>
(function(){
  var $=function(s){return document.querySelector(s);};
  var box=$('#box'),u=(new URLSearchParams(location.search).get('u')||'eom').toLowerCase();
  var NOME={eom:'English on Mission',culture:'Culture English',gratis:'Plataforma Inteligente · acesso grátis'};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var api=function(b){return fetch('/.netlify/functions/universo-cadastro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json();}).catch(function(){return {erro:'Sem conexão. Tente de novo.'};});};
  if(!NOME[u]){box.innerHTML='<div class="ok"><div class="big">🔒</div><h1>Link <em>indisponível</em></h1><p class="s">Peça um novo link pro Gediel.</p></div>';return;}
  box.innerHTML='<div class="k">Bem-vindo(a)</div><h1>Crie o seu <em>acesso</em></h1><p class="s">'+(u==='gratis'?'Cadastro rápido pra entrar na plataforma. Você começa com o acesso grátis e vê o que pode destravar depois.':'Cadastro rápido pra entrar no '+esc(NOME[u])+'. Você já entra direto na sua área.')+'</p>'
    +'<div class="plano"><span>'+esc(NOME[u])+'</span></div>'
    +'<label>Seu nome completo</label><input id="n" autocomplete="name" placeholder="Seu nome">'
    +'<label>E-mail (será o seu login)</label><input id="e" type="email" autocomplete="email" placeholder="voce@email.com">'
    +'<label>Crie uma senha (mínimo 6 caracteres)</label><input id="s" type="password" autocomplete="new-password" placeholder="••••••">'
    +'<label>WhatsApp (opcional)</label><input id="w" type="tel" autocomplete="tel" placeholder="(55) 99999-9999">'
    +'<input id="site" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">'
    +'<div class="erro" id="er"></div><button id="b">Criar meu acesso</button>';
  $('#b').onclick=async function(){
    var b=this,er=$('#er');er.textContent='';b.disabled=true;b.textContent='Criando…';
    var r=await api({u:u,nome:$('#n').value,email:$('#e').value,senha:$('#s').value,whatsapp:$('#w').value,site:$('#site').value});
    if(!r.ok){er.textContent=r.erro||'Não deu certo. Tente de novo.';b.disabled=false;b.textContent='Criar meu acesso';return;}
    box.innerHTML='<div class="ok"><div class="big">🎉</div><h1>Tudo <em>pronto</em>!</h1><p class="s">'+(r.existia?'Esse e-mail já tinha conta: entre com a sua senha de sempre.':'Seu acesso está criado. Entre com o e-mail e a senha que você acabou de criar.')+'</p><a class="go" href="membros.html">Entrar na plataforma</a></div>';
  };
})();
</script>
</body>
</html>
