 function next(){if(i>=deck.length)i=0;const w=deck[i++],rev=Math.random()<.3,ans=rev?w[0]:w[1];const others=shuf(pool.filter(x=>x!==w&&(rev?x[0]:x[1])!==ans)).slice(0,3).map(x=>rev?x[0]:x[1]);const opts=shuf([ans,...others]);q={w,ans};

 function round(){if(i>=deck.length)return endScreen(g,score,'de '+deck.length*10+' pontos','',missed);const w=deck[i],word=w[0].toUpperCase();let letters;do{letters=shuf(word.split(''))}while(letters.join('')===word&&word.length>1);let built=[];let hint=0;
  const draw=()=>{A().innerHTML=`${head(g,`<span class="mono">${i+1}/${deck.length}</span>`)}<div class="stage card"><div class="mono">dica · ${esc(w[2])}</div><div class="word" style="font-size:26px">${esc(w[1])}</div>

   <div class="tiles">${letters.map((l,k)=>`<button class="tile ${built.includes(k)?'used':''}" data-k="${k}">${l}</button>`).join('')}</div>
   <div class="fb" id="fb"></div><div class="row" style="justify-content:center"><button class="btn" id="hn">💡 Dica (${hint}/2)</button><button class="btn" id="cl">Limpar</button><button class="btn" id="sk">Pular</button></div><p class="mut sm">Pontos: ${score}</p></div>`;
   A().querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{built.push(+b.dataset.k);check()});

   $('#hn').onclick=()=>{if(hint>=2)return;hint++;built=[];const used=[];for(let p=0;p<hint;p++){const k=letters.findIndex((l,ix)=>l===word[p]&&!used.includes(ix));used.push(k);built.push(k)}draw()}};
  const check=()=>{draw();if(built.length===word.length){const got=built.map(k=>letters[k]).join('');if(got===word){sfx('ok');score+=10-hint*3;say(w[0]);$('#fb').innerHTML='<span style="color:var(--ok)">Isso! ✨</span>';setTimeout(()=>{i++;round()},800)}else{sfx('bad');$('#fb').innerHTML='<span style="color:var(--bad)">Quase… toque numa letra de cima pra desfazer</span>'}}};
  draw()}
 round()}

 const draw=()=>{const mask=word.split('').map(c=>c===' '?'&nbsp;':(got.has(c)?c:'_')).join('');const win=word.split('').every(c=>c===' '||got.has(c));

 draw()}

function build(g,items){const deck=shuf(items).slice(0,8);let i=0,score=0,missed=[];

   <div class="tiles">${tiles.map((t,ix)=>`<button class="tile ${built.includes(t)?'used':''}" data-t="${ix}" style="font-size:16px">${esc(t.w)}</button>`).join('')}</div>
   <div class="fb">${fb}</div><div class="row" style="justify-content:center"><button class="btn" id="cl">Limpar</button><button class="btn" id="sk">Ver resposta</button></div></div>`;
   A().querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{built.push(tiles[+b.dataset.t]);check()});
   A().querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{built.splice(+b.dataset.u,1);draw()});
   $('#cl').onclick=()=>{built=[];draw()};$('#sk').onclick=()=>{missed.push([it[0],g.id==='verse'?it[1]:it[1]]);draw(`<span class="mut">${esc(it[0])}</span> ${spk(it[0])} <button class="btn sm pri" id="nx2">Próxima</button>`);$('#nx2').onclick=()=>{i++;round()}}};
  const check=()=>{if(built.length<words.length)return draw();const ok=built.map(t=>t.w).join(' ')===it[0];if(ok){sfx('ok');score++;say(it[0]);draw('<span style="color:var(--ok)">Perfeito! ✨</span>');setTimeout(()=>{i++;round()},1400)}else sfx('bad'),draw('<span style="color:var(--bad)">Ordem errada. Toque numa palavra de cima pra tirar.</span>')};

/* ditado */
function dict(g){if(!('speechSynthesis' in window)){A().innerHTML=`${head(g)}<div class="card stage">Seu navegador não tem voz. Tente no Chrome ou Safari.</div>`;return}
 const deck=shuf(SENT).slice(0,8);let i=0,score=0,missed=[];
 function round(){if(i>=deck.length)return endScreen(g,score,'pontos de '+deck.length*10,'',missed);const s=deck[i];
  A().innerHTML=`${head(g,`<span class="mono">${i+1}/${deck.length}</span>`)}<div class="stage card"><div class="mono">ouça e escreva</div><div class="row" style="justify-content:center;margin:16px 0"><button class="btn pri big" data-say="${esc(s[0])}">🔊 Ouvir</button><button class="btn big" data-say="${esc(s[0])}" data-rate=".6">🐢 Devagar</button></div>
  <input type="text" id="in" placeholder="Escreva aqui o que você ouviu…" autocomplete="off" autocapitalize="off"><div class="fb diff" id="fb"></div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn pri" id="ck">Conferir</button></div></div>`;
  setTimeout(()=>say(s[0]),300);const inp=$('#in');inp.onkeydown=e=>{if(e.key==='Enter')$('#ck').click()};
  $('#ck').onclick=()=>{const a=norm(s[0]).split(' '),b=norm(inp.value).split(' ').filter(Boolean);let hit=0;const html=a.map(w=>{const k=b.indexOf(w);if(k>=0){b.splice(k,1);hit++;return `<span class="g">${esc(w)}</span>`}return `<span class="r">${esc(w)}</span>`}).join(' ');
   const pts=Math.round(hit/a.length*10);score+=pts;sfx(pts>=8?'ok':'bad');if(pts<10)missed.push(s);$('#fb').innerHTML=`${html}<div class="mut sm" style="margin-top:8px">${esc(s[0])}<br>${esc(s[1])}</div><div style="margin-top:6px">+${pts} pontos</div>`;
   $('#ck').textContent='Próxima →';$('#ck').onclick=()=>{i++;round()}}}
 round()}

/* falar */
function speak(g){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const deck=shuf(SENT).slice(0,8);let i=0,score=0,missed=[];
 function round(){if(i>=deck.length)return endScreen(g,score,'% de pronúncia média',score>=80?'Pronúncia muito boa!':'Continue treinando, fica natural rápido.',missed);
  const s=deck[i];let sum=+(round.sum||0);
  A().innerHTML=`${head(g,`<span class="mono">${i+1}/${deck.length}</span>`)}<div class="stage card"><div class="mono">leia em voz alta</div><div class="word" style="font-size:clamp(24px,6vw,36px)">${esc(s[0])}</div><div class="mut">${esc(s[1])}</div>
  <div class="row" style="justify-content:center;margin:16px 0">${spk(s[0])}${SR?'<button class="btn pri big" id="mic">🎤 Falar</button>':''}</div><div class="fb diff" id="fb">${SR?'':'Seu navegador não escuta (use o Chrome). Ouça no 🔊, repita em voz alta e se avalie:'}</div>
  <div class="row" style="justify-content:center" id="act">${SR?'':'<button class="btn ok" data-self="100">Falei bem</button><button class="btn" data-self="60">Mais ou menos</button><button class="btn bad" data-self="20">Travei</button>'}</div></div>`;
  const finish=p=>{sfx(p>=70?'ok':'bad');round.sum=(round.sum||0)+p;score=Math.round(round.sum/(i+1));if(p<70)missed.push(s);$('#act').innerHTML='<button class="btn pri" id="nx">Próxima →</button>';$('#nx').onclick=()=>{i++;round()}};
  A().querySelectorAll('[data-self]').forEach(b=>b.onclick=()=>finish(+b.dataset.self));
  if(SR)$('#mic').onclick=()=>{const r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=3;$('#mic').textContent='👂 Ouvindo…';
   r.onresult=e=>{const alts=[...e.results[0]].map(x=>x.transcript);const a=norm(s[0]).split(' ');let bestP=0,bestH='';alts.forEach(t=>{const b=norm(t).split(' ');let hit=0;const h=a.map(w=>{const k=b.indexOf(w);if(k>=0){b.splice(k,1);hit++;return `<span class="g">${esc(w)}</span>`}return `<span class="r">${esc(w)}</span>`}).join(' ');const p=Math.round(hit/a.length*100);if(p>=bestP){bestP=p;bestH=h}});
    $('#fb').innerHTML=`${bestH}<div class="mut sm" style="margin-top:6px">Entendi: “${esc(alts[0])}”</div><div style="margin-top:4px">${bestP}% ${bestP>=90?'🔥':bestP>=60?'👍':'💪'}</div>`;$('#mic').textContent='🎤 Tentar de novo';finish(bestP)};
   r.onerror=()=>{$('#mic').textContent='🎤 Falar';$('#fb').textContent='Não consegui ouvir. Libere o microfone e tente de novo.'};r.onend=()=>{if($('#mic')&&$('#mic').textContent.includes('Ouvindo'))$('#mic').textContent='🎤 Falar'};r.start()}}
 round.sum=0;round()}

/* times: proibidão e na testa */
function teams(g,mode){let cfg={a:'Time A',b:'Time B',sec:60,rounds:3,cat:Object.keys(HEADS)[0]};
 A().innerHTML=`${head(g)}<div class="stage card" style="text-align:left"><h2>${g.e} ${esc(g.n)}</h2><ol class="how mut">${mode==='taboo'?'<li>Um jogador do time pega o celular e explica a palavra <b>em inglês</b>.</li><li>Não pode dizer as palavras proibidas (nem traduzir pro português!).</li><li>✅ acertou +1 · ⏭ pulou 0 · 🚫 falou proibida −1.</li>':'<li>Um jogador põe o celular na testa, virado pros amigos.</li><li>Os amigos dão dicas <b>só em inglês</b>, sem dizer a palavra.</li><li>Quem segura o celular toca ✅ quando acertar ou ⏭ pra pular.</li>'}<li>O tempo acaba e passa a vez pro outro time.</li></ol>
 <div class="row" style="margin-top:10px"><input type="text" id="ta" value="${cfg.a}" style="flex:1;min-width:120px"><input type="text" id="tb" value="${cfg.b}" style="flex:1;min-width:120px"></div>${teamPick()}
 ${mode==='heads'?`<div class="chips" id="cats">${Object.keys(HEADS).concat(['Misturado']).map(c=>`<button class="chip ${c===cfg.cat?'on':''}" data-c="${c}">${c}</button>`).join('')}</div>`:''}
 <div class="row" style="margin-top:10px"><span class="mut sm">Tempo:</span>${[45,60,90].map(s=>`<button class="chip ${s===cfg.sec?'on':''}" data-s="${s}">${s}s</button>`).join('')}<span class="mut sm">Rodadas:</span>${[2,3,5].map(s=>`<button class="chip ${s===cfg.rounds?'on':''}" data-r="${s}">${s}</button>`).join('')}</div>
 <div class="row" style="justify-content:center;margin-top:16px"><button class="btn pri big" id="go">Começar</button></div></div>`;
 const tog=(sel,key,cast)=>A().querySelectorAll(sel).forEach(b=>b.onclick=()=>{cfg[key]=cast(b.dataset[sel.slice(6,7)]);A().querySelectorAll(sel).forEach(x=>x.classList.toggle('on',x===b))});
 tog('[data-s]','sec',Number);tog('[data-r]','rounds',Number);tog('[data-c]','cat',String);
 $('#go').onclick=()=>{cfg.a=$('#ta').value||'Time A';cfg.b=$('#tb').value||'Time B';play()};
 function play(){const pool=mode==='taboo'?shuf(TABOO):shuf(cfg.cat==='Misturado'?Object.values(HEADS).flat():HEADS[cfg.cat]).map(w=>[w,[]]);let pi=0,pts={a:0,b:0},turn=0;
  const nextCard=()=>{if(pi>=pool.length)pi=0;return pool[pi++]};
  function intro(){const tk=turn%2?'b':'a';if(turn>=cfg.rounds*2)return final();A().innerHTML=`${head(g)}<div class="stage card"><div class="mono">rodada ${Math.floor(turn/2)+1} de ${cfg.rounds}</div><div class="word">Vez do ${esc(cfg[tk])}</div><p class="mut">${mode==='taboo'?'Passe o celular pra quem vai explicar.':'Quem vai adivinhar: celular na testa!'}</p><p class="mono">${esc(cfg.a)} ${pts.a} × ${pts.b} ${esc(cfg.b)}</p><button class="btn pri big" id="st">Valendo!</button></div>`;$('#st').onclick=()=>run(tk)}
  function run(tk){let c=nextCard(),got=0,log=[];
   const draw=()=>{A().innerHTML=`<div class="top"><span class="mono">${esc(cfg[tk])} · ${got} pts</span><span class="timer" id="tm"></span><button class="btn sm" id="ab">Encerrar</button></div><div class="stage card"><div class="word ${mode==='heads'?'huge':''}">${esc(c[0])}</div>${mode==='taboo'?`<ul class="forb">${c[1].map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
    <div class="row" style="justify-content:center;margin-top:18px"><button class="btn ok big" id="y">✅ Acertou</button><button class="btn big" id="p">⏭ Pular</button>${mode==='taboo'?'<button class="btn bad big" id="n">🚫 Proibida</button>':''}</div></div>`;
    $('#y').onclick=()=>{sfx('ok');got++;log.push([c[0],'✅']);c=nextCard();draw();tick()};$('#p').onclick=()=>{sfx('tick');log.push([c[0],'⏭']);c=nextCard();draw();tick()};if($('#n'))$('#n').onclick=()=>{sfx('bad');got--;log.push([c[0],'🚫']);c=nextCard();draw();tick()};$('#ab').onclick=end};
   let left=cfg.sec;const tick=()=>{const t=$('#tm');if(t){t.textContent=left;t.classList.toggle('low',left<=10)}};
   const end=()=>{stopT();pts[tk]+=got;turn++;A().innerHTML=`${head(g)}<div class="stage card"><div class="mono">tempo!</div><div class="word">${esc(cfg[tk])}: ${got>=0?'+':''}${got}</div><div class="missed">${log.map(l=>`<div><span>${l[1]} <b>${esc(l[0])}</b></span>${spk(l[0])}</div>`).join('')}</div><button class="btn pri big" id="nx" style="margin-top:14px">Próximo time</button></div>`;$('#nx').onclick=intro};
   draw();countdown(cfg.sec,l=>{left=l;tick()},end)}
  function final(){played(g.id);addXP(15);podium(g,[[cfg.a,pts.a],[cfg.b,pts.b]],{team:1})}
  intro()}}

function cards(g,decks,tip){const names=Object.keys(decks);let dk=names[0],deck=shuf(decks[dk]),i=0;
 const draw=()=>{const c=deck[i%deck.length],txt=Array.isArray(c)?c[0]:c;
  A().innerHTML=`${head(g,`<span class="mono">${i%deck.length+1}/${deck.length}</span>`)}${names.length>1?`<div class="chips" style="justify-content:center">${names.map(n=>`<button class="chip ${n===dk?'on':''}" data-d="${n}">${n}</button>`).join('')}</div>`:''}
  <div class="stage card"><div class="word" style="font-size:clamp(24px,6vw,36px)">${esc(txt)}</div>${Array.isArray(c)?`<div class="mut">${esc(c[1])}</div>`:''}
  ${Array.isArray(c)&&c[2]?`<div class="ph"><div class="mono">comece assim</div>${c[2].map(p=>`<div>• ${esc(p)}</div>`).join('')}</div>`:''}
  <div class="row" style="justify-content:center;margin-top:16px">${spk(txt)}<button class="btn" id="tmr">⏱ 60s pra responder</button><span class="timer" id="tm"></span></div>
  <div class="row" style="justify-content:center;margin-top:12px"><button class="btn big" id="pv">←</button><button class="btn pri big" id="nx">Próxima carta</button></div>
  <p class="mut sm" style="margin-top:14px">${tip}</p></div>`;
  A().querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{dk=b.dataset.d;deck=shuf(decks[dk]);i=0;stopT();draw()});
  $('#nx').onclick=()=>{stopT();i++;if(i%deck.length===0){played(g.id);addXP(10)}draw()};$('#pv').onclick=()=>{stopT();i=Math.max(0,i-1);draw()};
  $('#tmr').onclick=()=>countdown(60,l=>{const t=$('#tm');if(t){t.textContent=l+'s';t.classList.toggle('low',l<=10)}},()=>{const t=$('#tm');if(t)t.textContent='tempo! ⏰'})};
 played(g.id);addXP(3);draw()}

/* story chain e pitch: cenário + palavras + tempo */
function chain(g,mode){let n=1,sec=mode==='pitch'?45:30;const start=pick(mode==='pitch'?PITCH:STARTS);let scene=start;
 const deal=()=>{const pool=mode==='pitch'?PWORDS:SWORDS;return shuf(pool).slice(0,3)};
 const draw=()=>{const ws=deal();A().innerHTML=`${head(g)}<div class="stage card"><div class="mono">${mode==='pitch'?'cenário':'começo da história'}</div><div class="word" style="font-size:clamp(22px,5.5vw,32px)">${esc(scene)}</div>

  <p class="mut sm" style="margin-top:14px">${mode==='pitch'?'Fale em inglês por 45s. Quem ouviu dá nota de 1 a 5 pra clareza e energia.':'Continue a história em inglês por 30s usando as 3 palavras. Depois passe a vez.'}</p></div>`;
  $('#go').onclick=()=>countdown(sec,l=>{const t=$('#tm');if(t){t.textContent=l+'s';t.classList.toggle('low',l<=5)}},()=>{const t=$('#tm');if(t)t.textContent='tempo! ⏰'});
  $('#nx').onclick=()=>{stopT();n++;if(mode==='pitch')scene=pick(PITCH);if(n%4===0){played(g.id);addXP(10)}draw()}};

/* ---------- SUDOKU NUMBERS ---------- */
function sudoGen(n){const br=2,bc=n/2;let g=[];for(let r=0;r<n;r++){g.push([]);for(let c=0;c<n;c++)g[r].push((bc*(r%br)+Math.floor(r/br)+c)%n)}
 const perm=shuf([...Array(n).keys()]);g=g.map(r=>r.map(v=>perm[v]));
 const bands=shuf([...Array(n/br).keys()]),rows=[];bands.forEach(b=>shuf([...Array(br).keys()]).forEach(k=>rows.push(g[b*br+k])));g=rows;
 const stacks=shuf([...Array(n/bc).keys()]),cols=[];stacks.forEach(s=>shuf([...Array(bc).keys()]).forEach(k=>cols.push(s*bc+k)));g=g.map(r=>cols.map(c=>r[c]));return g}
function sudo(g){A().innerHTML=`${head(g)}<div class="stage card"><div class="word" style="font-family:Fredoka">Sudoku Numbers</div><p class="mut">Cada linha, coluna e bloco precisa ter todos os números, escritos em inglês. Toque numa casa vazia e escolha o número.</p><div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri big" data-n="4">Fácil · 4×4</button><button class="btn big" data-n="6">Médio · 6×6</button></div></div>`;
 A().querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>play(+b.dataset.n));
 function play(n){const sol=sudoGen(n),bc=n/2,cells=n*n,holes=n===4?9:20;const giv=sol.map(r=>r.map(()=>true));shuf([...Array(cells).keys()]).slice(0,holes).forEach(i=>giv[Math.floor(i/n)][i%n]=false);
  const cur=sol.map((r,ri)=>r.map((v,ci)=>giv[ri][ci]?v:null));let sel=null,dig=false,t0=Date.now(),errs=0;
  const conf=(r,c)=>{const v=cur[r][c];if(v===null)return false;for(let k=0;k<n;k++){if(k!==c&&cur[r][k]===v)return true;if(k!==r&&cur[k][c]===v)return true}const R=Math.floor(r/2)*2,C=Math.floor(c/bc)*bc;for(let a=R;a<R+2;a++)for(let b=C;b<C+bc;b++)if((a!==r||b!==c)&&cur[a][b]===v)return true;return false};
  const draw=()=>{const done=cur.every((r,ri)=>r.every((v,ci)=>v!==null&&!conf(ri,ci)));
   A().innerHTML=`${head(g,`<span class="mono" id="sclk">0s</span>`)}<div class="stage card"><div class="sdk" style="--n:${n}">${cur.map((r,ri)=>r.map((v,ci)=>`<button class="sc ${giv[ri][ci]?'gv':''} ${sel&&sel[0]===ri&&sel[1]===ci?'sel':''} ${conf(ri,ci)?'cf':''} ${ci%bc===bc-1&&ci<n-1?'br':''} ${ri%2===1&&ri<n-1?'bb':''}" data-rc="${ri},${ci}">${v===null?'':(dig?`<small>${v+1}</small>`:'')+NUMW[v]}</button>`).join('')).join('')}</div>
   ${done?`<div class="word" style="color:var(--ok);font-size:30px;animation:popin .5s">Solved! 🎉</div><button class="btn pri big" onclick="openG('sudo')">Jogar de novo</button>`:`<div class="pad">${NUMW.slice(0,n).map((w,k)=>`<button class="btn" data-v="${k}">${w}${dig?` <span class="mut sm">${k+1}</span>`:''}</button>`).join('')}<button class="btn" data-v="x">⌫</button></div>
   <label class="mut sm" style="display:inline-flex;gap:6px;align-items:center;margin-top:12px"><input type="checkbox" id="dg" ${dig?'checked':''} style="width:auto"> mostrar o número em dígito (ajuda)</label>`}</div>`;
   A().querySelectorAll('[data-rc]').forEach(b=>b.onclick=()=>{const [r,c]=b.dataset.rc.split(',').map(Number);if(giv[r][c]){say(NUMW[cur[r][c]]);return}sel=[r,c];draw()});
   A().querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(!sel)return;const v=b.dataset.v;cur[sel[0]][sel[1]]=v==='x'?null:+v;if(v!=='x'){say(NUMW[+v]);if(conf(sel[0],sel[1])){errs++;sfx('bad')}else sfx('tick')}draw()});
   const d=$('#dg');if(d)d.onchange=()=>{dig=d.checked;draw()};
   if(done){if(window._sw!==sol){window._sw=sol;say('Solved!');celebrate(n===6)}const sec=Math.round((Date.now()-t0)/1000);stopT();played(g.id);addXP(n===4?15:40);best(g.id,Math.max(1,(n===4?300:900)-sec-errs*10));$('#sclk').textContent=sec+'s'}};
  draw();TM=setInterval(()=>{const e=$('#sclk');if(e)e.textContent=Math.round((Date.now()-t0)/1000)+'s'},1000)}}

/* ---------- CHUVA DE LETRAS ---------- */
function drop(g){const W=7,H=11;let B=Array.from({length:H},()=>Array(W).fill(null)),q=[],cur=null,score=0,lines=[],busy=false,over=false,speed=850,loop=null,combo=0;
 const refill=()=>{while(q.length<6){const w=pick(DWORDS);q.push(...w.toUpperCase().split(''))}};
 const spawn=()=>{refill();cur={x:3,y:0,ch:q.shift()};if(B[0][3]){over=true;finish()}};
 const cs=Math.min(46,Math.floor((Math.min(innerWidth,620)-64)/W));
 A().innerHTML=`${head(g,'<span class="mono">pts <b id="dsc">0</b></span>')}<div class="stage"><div class="row sp" style="margin-bottom:8px"><span class="mono">próximas</span><div id="dq" class="row" style="gap:4px"></div></div>
 <div id="well" class="well" style="width:${cs*W+8}px;height:${cs*H+8}px;--cs:${cs}px"></div><div class="mut sm" id="dlast" style="min-height:22px;margin-top:6px">Dica: as próximas letras formam palavras. Monte na horizontal ou vertical!</div>
 <div class="row" style="justify-content:center;margin-top:8px"><button class="btn big" id="dl">◀</button><button class="btn big" id="dd">▼</button><button class="btn pri big" id="dh">⤓</button><button class="btn big" id="dr">▶</button></div></div>`;
 const well=$('#well');
 const draw=(pop)=>{if(!well.isConnected)return;let h='';for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=B[y][x];if(c)h+=`<div class="blk ${pop&&pop.has(y*W+x)?'pop':''}" style="left:${x*cs+4}px;top:${y*cs+4}px">${c}</div>`}
  if(cur&&!over){let gy=cur.y;while(gy+1<H&&!B[gy+1][cur.x])gy++;h+=`<div class="blk gh" style="left:${cur.x*cs+4}px;top:${gy*cs+4}px">${cur.ch}</div><div class="blk cur" style="left:${cur.x*cs+4}px;top:${cur.y*cs+4}px">${cur.ch}</div>`}
  well.innerHTML=h;$('#dq').innerHTML=q.slice(0,5).map((c,i)=>`<span class="tile" style="padding:4px 9px;font-size:15px;opacity:${1-i*.15}">${c}</span>`).join('');$('#dsc').textContent=score};
 const find=()=>{const hit=new Set(),found=[];const scan=(cellsAt,len)=>{for(let s=0;s<len;s++)for(let L=Math.min(5,len-s);L>=3;L--){const cl=[];let str='';for(let k=0;k<L;k++){const [y,x]=cellsAt(s+k);const c=B[y][x];if(!c){str=null;break}str+=c;cl.push(y*W+x)}if(!str)continue;const lw=str.toLowerCase(),rv=[...lw].reverse().join('');const ok=DICT.has(lw)?lw:(DICT.has(rv)?rv:null);if(ok){cl.forEach(i=>hit.add(i));found.push(ok);break}}};
  for(let y=0;y<H;y++)scan(i=>[y,i],W);for(let x=0;x<W;x++)scan(i=>[i,x],H);return{hit,found}};
 const settle=()=>{for(let x=0;x<W;x++){const col=[];for(let y=H-1;y>=0;y--)if(B[y][x])col.push(B[y][x]);for(let y=H-1,k=0;y>=0;y--,k++)B[y][x]=col[k]||null}};
 const resolve=()=>{if(!well.isConnected||over)return;const {hit,found}=find();if(!hit.size){combo=0;busy=false;spawn();if(!over)draw();return}busy=true;combo++;
  sfx('ok');found.forEach(w=>{score+=w.length*10*combo;lines.push(w)});say(found.join(', '));$('#dlast').innerHTML=found.map(w=>`<b style="color:var(--ok)">${w}</b>`).join(' · ')+(combo>1?` · combo x${combo} 🔥`:'');
  draw(hit);setTimeout(()=>{hit.forEach(i=>B[Math.floor(i/W)][i%W]=null);settle();draw();speed=Math.max(320,850-Math.floor(score/60)*50);restart();setTimeout(resolve,180)},420)};
 const land=()=>{sfx('tick');B[cur.y][cur.x]=cur.ch;cur=null;resolve()};
 const fall=()=>{if(busy||over||!cur)return;if(cur.y+1<H&&!B[cur.y+1][cur.x]){cur.y++;draw()}else land()};
 const mv=d=>{if(busy||!cur)return;const nx=cur.x+d;if(nx>=0&&nx<W&&!B[cur.y][nx]){cur.x=nx;draw()}};
 const hard=()=>{if(busy||!cur)return;while(cur.y+1<H&&!B[cur.y+1][cur.x])cur.y++;land()};
 const restart=()=>{clearInterval(loop);loop=setInterval(fall,speed)};
 const key=e=>{if(e.key==='ArrowLeft')mv(-1);else if(e.key==='ArrowRight')mv(1);else if(e.key==='ArrowDown')fall();else if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();hard()}};
 addEventListener('keydown',key);let sx=null,sy=null;well.onpointerdown=e=>{sx=e.clientX;sy=e.clientY};well.onpointerup=e=>{if(sx===null)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>20)mv(dx>0?1:-1);else if(dy>40)hard();else{const r=well.getBoundingClientRect(),cx=Math.floor((e.clientX-r.left-4)/cs);if(cur)mv(Math.sign(cx-cur.x))}sx=null};
 $('#dl').onclick=()=>mv(-1);$('#dr').onclick=()=>mv(1);$('#dd').onclick=fall;$('#dh').onclick=hard;
 window.CLEAN=()=>{clearInterval(loop);removeEventListener('keydown',key)};
 function finish(){clearInterval(loop);removeEventListener('keydown',key);window.CLEAN=null;const u=[...new Set(lines)];endScreen(g,score,'pontos · '+lines.length+' palavras',u.length?'Palavras que você formou:':'Dica: olhe as “próximas letras”, elas formam palavras.',u.slice(0,10).map(w=>[w,'']))}
 spawn();draw();restart()}

 function reveal(tk){if(di>=deck.length){deck=shuf(DRAWW);di=0}const w=deck[di++];A().innerHTML=`${head(g)}<div class="stage card"><div class="mono">desenhe</div><div class="word huge" style="animation:popin .4s">${esc(w[0])}</div><div class="mut">${esc(w[1])}</div><div style="margin-top:6px">${spk(w[0])}</div><button class="btn pri big" id="dw" style="margin-top:16px">✏️ Começar a desenhar</button></div>`;$('#dw').onclick=()=>board(tk,w)}
 function board(tk,w){const cols=['#f5f5f7','#ff8a9b','#ffd36e','#7ee0a8','#7cc4ff','#c9a7ff','#111111'];let col=cols[0],size=5;

 $('#sp').onclick=()=>{$('#sp').disabled=true;const L=pick(LET);let n=0;const ro=$('#ro');const spin=()=>{if(!ro.isConnected)return;n++;ro.textContent=pick(LET);ro.style.transform=`rotateX(${n*36}deg)`;if(n<18)setTimeout(spin,40+n*9);else{ro.textContent=L;ro.style.transform='';ro.classList.add('land');sfx('ok');setTimeout(()=>ro.isConnected&&play(L),900)}};spin()};
 function play(L){A().innerHTML=`<div class="top"><span class="mono">letra</span><span class="roul sm2">${L}</span><span class="timer" id="tm">${sec}</span></div><div class="stage card" style="text-align:left">${STOPC.map((c,i)=>`<label class="stp"><span><b>${c[0]}</b> <span class="mut sm">${c[1]}</span></span><input type="text" data-i="${i}" placeholder="${L}…" autocomplete="off" autocapitalize="off"></label>`).join('')}<div class="row" style="justify-content:center;margin-top:14px"><button class="btn bad big" id="st" style="font-weight:700;letter-spacing:.1em">✋ STOP!</button></div></div>`;

function snake(g){const N=13;let words=shuf(VOC.filter(w=>/^[a-z]{3,6}$/.test(w[0]))),wi=0,score=0,lives=3,speed=230,loop=null,done=[];
 let S,dir,nd,word,need,items;const cv=document.createElement('canvas');
 A().innerHTML=`${head(g,'<span class="mono" id="sl"></span>')}<div class="stage"><div class="card" style="padding:10px;margin-bottom:8px"><div class="mono" id="sh"></div><div id="sw" class="sw2"></div></div><div id="sbox"></div>
 <div class="dpad"><span></span><button class="btn" data-d="0,-1">▲</button><span></span><button class="btn" data-d="-1,0">◀</button><button class="btn" data-d="0,1">▼</button><button class="btn" data-d="1,0">▶</button></div></div>`;
 const box=$('#sbox'),sz=Math.min(420,Math.min(innerWidth,620)-32),cs=sz/N,dpr=devicePixelRatio||1;cv.width=sz*dpr;cv.height=sz*dpr;cv.style.width=cv.style.height=sz+'px';cv.className='scv';box.appendChild(cv);const x=cv.getContext('2d');x.scale(dpr,dpr);
 const free=()=>{let p;do{p=[Math.floor(Math.random()*N),Math.floor(Math.random()*N)]}while(S.some(s=>s[0]===p[0]&&s[1]===p[1])||items.some(i=>i.p[0]===p[0]&&i.p[1]===p[1])||Math.abs(p[0]-S[0][0])+Math.abs(p[1]-S[0][1])<3);return p};
 const reset=()=>{S=[[4,6],[3,6],[2,6]];dir=[1,0];nd=[1,0]};
 const newWord=()=>{if(wi>=words.length){words=shuf(words);wi=0}const w=words[wi++];word=w;need=0;items=[];reset();
  w[0].toUpperCase().split('').forEach((ch,k)=>items.push({ch,k,p:[0,0]}));items.forEach(it=>{it.p=[-9,-9]});items.forEach(it=>it.p=free());
  for(let d=0;d<2;d++){const ch='ABCDEFGHIJKLMNOPRSTUVWY'[Math.floor(Math.random()*23)];const it={ch,k:-1,p:[-9,-9]};items.push(it);it.p=free()}hud()};
 const hud=()=>{$('#sh').textContent='soletre · '+word[1];$('#sw').innerHTML=word[0].toUpperCase().split('').map((c,k)=>`<span class="${k<need?'got':''}">${k<need?c:'_'}</span>`).join('');$('#sl').textContent='❤️'.repeat(lives)+' · '+score+' pts'};
 const draw=()=>{x.fillStyle='#12121b';x.fillRect(0,0,sz,sz);x.strokeStyle='rgba(255,255,255,.04)';for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*cs,0);x.lineTo(i*cs,sz);x.stroke();x.beginPath();x.moveTo(0,i*cs);x.lineTo(sz,i*cs);x.stroke()}
  items.forEach(it=>{if(it.k>=0&&it.k<need)return;const nx=it.k===need;x.fillStyle=nx?'#ffd36e':'rgba(255,255,255,.14)';x.beginPath();x.roundRect(it.p[0]*cs+3,it.p[1]*cs+3,cs-6,cs-6,7);x.fill();x.fillStyle=nx?'#111':'#f5f5f7';x.font=`700 ${cs*.55}px Fredoka,sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(it.ch,it.p[0]*cs+cs/2,it.p[1]*cs+cs/2+1)});
  S.forEach((s,i)=>{const t=i/S.length;x.fillStyle=`hsl(${140-t*40} 70% ${58-t*18}%)`;x.beginPath();x.roundRect(s[0]*cs+2,s[1]*cs+2,cs-4,cs-4,i===0?9:6);x.fill()});
  const h=S[0];x.fillStyle='#111';x.beginPath();x.arc(h[0]*cs+cs/2+dir[0]*cs*.18-dir[1]*cs*.16,h[1]*cs+cs/2+dir[1]*cs*.18+dir[0]*cs*.16,cs*.08,0,7);x.arc(h[0]*cs+cs/2+dir[0]*cs*.18+dir[1]*cs*.16,h[1]*cs+cs/2+dir[1]*cs*.18-dir[0]*cs*.16,cs*.08,0,7);x.fill()};

  S.unshift(h);const it=items.find(i=>i.p[0]===h[0]&&i.p[1]===h[1]&&!(i.k>=0&&i.k<need));
  if(it){if(it.k===need){need++;sfx('tick');say(it.ch.toLowerCase());if(need===word[0].length){sfx('ok');confetti(50);score+=word[0].length*10;done.push(word);say(word[0]);speed=Math.max(110,speed-12);restart();setTimeout(newWord,0)}hud()}else{S.pop();it.p=free();hurt()}}else S.pop();draw()};
 const restart=()=>{clearInterval(loop);loop=setInterval(step,speed)};
 const turn=(dx,dy)=>{if(dx===-dir[0]&&dy===-dir[1])return;nd=[dx,dy]};
 const key=e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();turn(...m)}};addEventListener('keydown',key);
 A().querySelectorAll('[data-d]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();turn(...b.dataset.d.split(',').map(Number))});
 let sx,sy;cv.onpointerdown=e=>{sx=e.clientX;sy=e.clientY};cv.onpointerup=e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<15)return;Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy))};
 window.CLEAN=()=>{clearInterval(loop);removeEventListener('keydown',key)};
 function finish(){clearInterval(loop);removeEventListener('keydown',key);window.CLEAN=null;endScreen(g,score,'pontos · '+done.length+' palavras soletradas','',done.map(w=>[w[0],w[1]]).concat([[word[0],word[1]]]).slice(-8))}
 newWord();draw();restart()}

const QV=QB.map(q=>({lv:q[0],q:q[1],o:q[2],x:q[3]}));
function sayOf(q){if(/How do you say|Which word means|Which one|Which sentence/.test(q.q))return q.o[0];if(q.q.includes('___')){const m=q.q.match(/“([^”]*___[^”]*)”/);return (m?m[1]:q.q).replace('___',q.o[0]).replace(/—.*/,'')}const m=q.q.match(/“([^”]+)”/);if(m&&/^[\x00-\x7F]+$/.test(m[1]))return m[1];return /^[\x00-\x7F]+$/.test(q.o[0])?q.o[0]:''}
function vq(lv){const pool=VOC_ALL.filter(w=>w.lv===lv);const w=pick(pool);const others=shuf(pool.filter(x=>x[1]!==w[1])).slice(0,3).map(x=>x[1]);return{lv,q:`What does “${w[0]}” mean?`,o:[w[1],...others],x:`${w[0]} = ${w[1]}`}}
function getQs(lv,n){const a=shuf(QV.filter(q=>q.lv===lv)).slice(0,Math.ceil(n*.7));while(a.length<n)a.push(vq(lv));return shuf(a).map(q=>Object.assign({},q,{opts:shuf(q.o.map((t,i)=>({t,ok:i===0})))}))}

const PR=[1000,2000,3000,5000,10000,20000,30000,50000,100000,200000,300000,500000,750000,900000,1000000],SAFE=[4,9];
const brl=n=>'R$ '+n.toLocaleString('pt-BR'),shortP=p=>p>=1e6?'1 MILHÃO':p>=1000?(p/1000)+' mil':p;
function tower(g){const L=ST.lvl,pools={};const take=t=>{if(!pools[t]||!pools[t].length)pools[t]=getQs(t,15);return pools[t].shift()};
 let step=0,used={},cur=null,lock=false;
 const tierOf=s=>Math.min(3,Math.max(1,L+(s<5?-1:s<10?0:1)));const safeVal=()=>step>9?PR[9]:step>4?PR[4]:0;const stopVal=()=>step?PR[step-1]:0;
 function intro(){A().innerHTML=`${head(g)}<div class="stage card show-intro"><div class="ce-big">💰</div><div class="word" style="font-family:Fredoka">Torre do Milhão</div><p class="mut">15 perguntas de inglês. Cada acerto sobe um degrau. Nos degraus <b style="color:var(--warn)">10 mil</b> e <b style="color:var(--warn)">200 mil</b> o prêmio fica garantido.</p>

 function newQ(){cur=take(tierOf(step));render()}
 function render(){lock=false;stopT();
  A().innerHTML=`${head(g)}<div class="lad" id="lad">${PR.map((p,k)=>`<span class="${k===step?'now':''} ${k<step?'done':''} ${SAFE.includes(k)?'safe':''}">${k+1} · ${shortP(p)}</span>`).join('')}</div>

function themeWords(th,min,max){const ok=w=>/^[a-z]+$/.test(w[0])&&w[0].length>=min&&w[0].length<=max;let pool=VOC.filter(w=>ok(w)&&(th==='mix'||w[2]===th));if(pool.length<6)pool=VOC.filter(ok);return shuf(pool)}

function cwBuild(words){const M=new Map(),K=(x,y)=>x+','+y,P=[];const get=(x,y)=>M.get(K(x,y));
 const canPlace=(W,x,y,dir)=>{const dx=dir?0:1,dy=dir?1:0;if(get(x-dx,y-dy)||get(x+dx*W.length,y+dy*W.length))return -1;let cross=0;

 const put=(w,x,y,dir)=>{const W=w[0].toUpperCase(),dx=dir?0:1,dy=dir?1:0,id=P.length;for(let k=0;k<W.length;k++){const key=K(x+dx*k,y+dy*k);const c=M.get(key)||{ch:W[k],d:{},w:[]};c.d[dir]=1;c.w.push(id);M.set(key,c)}P.push({w:w[0],pt:w[1],x,y,dir,W})};
 put(words[0],0,0,0);
 for(const w of words.slice(1)){if(P.length>=9)break;if(P.some(p=>p.w===w[0]))continue;const W=w[0].toUpperCase();let bestP=null;
  M.forEach((c,key)=>{const [cx,cy]=key.split(',').map(Number);for(let k=0;k<W.length;k++){if(W[k]!==c.ch)continue;for(const dir of [0,1]){if(c.d[dir])continue;const x=dir?cx:cx-k,y=dir?cy-k:cy;const s=canPlace(W,x,y,dir);if(s>0&&(!bestP||s>bestP.s||(s===bestP.s&&Math.random()<.3)))bestP={x,y,dir,s}}}});
  if(bestP)put(w,bestP.x,bestP.y,bestP.dir)}
 let mx=1e9,my=1e9,Mx=-1e9,My=-1e9;M.forEach((c,key)=>{const [x,y]=key.split(',').map(Number);mx=Math.min(mx,x);my=Math.min(my,y);Mx=Math.max(Mx,x);My=Math.max(My,y)});
 const W=Mx-mx+1,H=My-my+1;P.forEach(p=>{p.x-=mx;p.y-=my});const cells={};M.forEach((c,key)=>{const [x,y]=key.split(',').map(Number);cells[(y-my)*W+(x-mx)]={ch:c.ch,w:c.w}});
 const starts=[...new Set(P.map(p=>p.y*W+p.x))].sort((a,b)=>a-b);P.forEach(p=>p.num=starts.indexOf(p.y*W+p.x)+1);return{W,H,P,cells}}
function cross(g){themePick(g,th=>{let best=null;for(let t=0;t<12;t++){const ws=themeWords(th,3,9).slice(0,24).sort((a,b)=>b[0].length-a[0].length);if(ws.length<3)break;const c=cwBuild([ws[0],...shuf(ws.slice(1))]);const sc_=c=>c.P.length*10-Math.max(0,c.W-11)*6-Math.max(0,c.H-13)*3;if(!best||sc_(c)>sc_(best))best=c;if(best.P.length>=8&&best.W<=11)break}
  const {W,H,P,cells}=best;let cur=0,dirSel=P[0].dir,reveals=0;const solved=new Set();const t0=Date.now();

  <div class="cwclue" id="cwc"></div><div class="row" style="justify-content:center;margin-top:8px"><button class="btn sm" id="rl">💡 Revelar letra</button><button class="btn sm" id="ck">✔️ Conferir</button><button class="btn sm" id="ga">🏳️ Ver respostas</button></div>
  <div class="cwl"><div><div class="mono">→ horizontais</div>${P.filter(p=>!p.dir).sort((a,b)=>a.num-b.num).map(p=>`<div class="ci" data-p="${P.indexOf(p)}"><b>${p.num}</b> ${esc(p.pt)} <small>(${p.W.length})</small></div>`).join('')}</div><div><div class="mono">↓ verticais</div>${P.filter(p=>p.dir).sort((a,b)=>a.num-b.num).map(p=>`<div class="ci" data-p="${P.indexOf(p)}"><b>${p.num}</b> ${esc(p.pt)} <small>(${p.W.length})</small></div>`).join('')}</div></div>

  const focusP=(k,pos)=>{cur=k;dirSel=P[k].dir;hl();const cl=pcells(P[k]);const i=pos!==undefined?pos:cl.find(i=>!inp(i).value)??cl[0];inp(i).focus()};

   if(solved.size===P.length){stopT();const s=Math.round((Date.now()-t0)/1000);setTimeout(()=>endScreen(g,Math.max(10,P.length*20-reveals*8-Math.floor(s/10)),'pontos · '+P.length+' palavras em '+s+'s','',P.map(p=>[p.w,p.pt])),900)}}};

  $('#ck').onclick=()=>{let bad=0;Object.keys(cells).forEach(i=>{const e=inp(i);if(e.value&&e.value.toUpperCase()!==cells[i].ch){bad++;const l=e.parentElement;l.classList.remove('bad');void l.offsetWidth;l.classList.add('bad')}});sfx(bad?'bad':'ok')};

function talk(text,rate,cb){if(!('speechSynthesis' in window)){cb&&cb();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';if(VOICE)u.voice=VOICE;u.rate=rate;const a=$('#av');if(a)a.classList.add('talk');u.onend=u.onerror=()=>{const b=$('#av');if(b)b.classList.remove('talk');cb&&cb()};speechSynthesis.speak(u)}
let REC=null;function listen(btn,ta){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Seu navegador não tem reconhecimento de voz. Use o Chrome ou digite a resposta.');return}if(REC){REC.stop();return}
 const r=new SR();REC=r;r.lang='en-US';r.continuous=true;r.interimResults=true;const base=ta.value?ta.value.trim()+' ':'';r.onresult=e=>{let t='';for(const x of e.results)t+=x[0].transcript;ta.value=base+t};r.onend=()=>{REC=null;btn.textContent='🎤 Falar';btn.classList.remove('rec')};r.onerror=()=>{};r.start();btn.textContent='⏹ Parar';btn.classList.add('rec')}
function evalAns(q,text){const t=' '+text.toLowerCase().replace(/[’‘]/g,"'")+' ',w=text.trim().split(/\s+/).filter(Boolean).length,items=[];let hits=0,fl=0;
 if(!w)return{score:0,items:[['bad','Sem resposta.']],flag:false};
 if(w<q.min)items.push(['bad','Resposta curta demais. Use uma frase completa.']);else if(w>q.max)items.push(['warn','Longa demais. Seja mais direto.']);else items.push(['ok','Tamanho ideal ('+w+' palavras)']);
 q.need.forEach(([re,l])=>{if(re.test(t)){hits++;items.push(['ok',l])}else items.push(['bad',l])});
 q.flags.forEach(([re,l])=>{if(re.test(t)){fl++;items.push(['flag',l])}});
 const lenOk=w>=q.min&&w<=q.max;let score=(lenOk?30:12)+70*(q.need.length?hits/q.need.length:1)-35*fl;return{score:Math.max(0,Math.min(100,Math.round(score))),items,flag:fl>0}}
function simRun(s){let mode='treino';const rate=[.8,.92,1][ST.lvl-1];
 const intro=()=>{A().innerHTML=`${head(s)}<div class="simsc" style="--c1:${s.c[0]};--c2:${s.c[1]}"><div class="av big">${s.av}</div><div class="word" style="font-family:Fredoka">${esc(s.n)}</div><p style="opacity:.85;margin:0">${esc(s.d)}</p></div>
  <div class="card" style="margin-top:12px"><div class="mono">o que avaliam</div>${s.tips.map(t=>`<div style="margin:6px 0">✅ ${esc(t)}</div>`).join('')}
  <div class="mono" style="margin-top:12px">modo</div><div class="chips"><button class="chip on" data-m="treino">🧑‍🏫 Treino (com dica e resposta modelo)</button><button class="chip" data-m="real">🎯 Real (sem ajuda)</button></div>
  <p class="mut sm">Você responde falando (🎤) ou digitando. ${s.qs.length} perguntas. Nível ${LV[ST.lvl].e} ${LV[ST.lvl].n}: ${ST.lvl===1?'o entrevistador fala devagar e a tradução aparece.':ST.lvl===2?'velocidade normal, tradução se você tocar.':'velocidade real; no modo Real a pergunta só é falada, sem texto.'}</p>
  <button class="btn pri big" id="go" style="width:100%">Começar simulação</button><p class="mut sm" style="margin-top:10px">Simulação para treinar inglês. Não é orientação jurídica nem consular.</p></div>`;
  A().querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;A().querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b))});$('#go').onclick=()=>{i=0;res=[];ask()}};
 let i=0,res=[];
 const ask=()=>{const q=s.qs[i],hide=ST.lvl===3&&mode==='real';
  A().innerHTML=`${head(s,`<span class="mono">${i+1}/${s.qs.length}</span>`)}<div class="simsc sm" style="--c1:${s.c[0]};--c2:${s.c[1]}"><div class="officer"><div class="av" id="av">${s.av}</div><div class="bub"><div class="mono" style="color:rgba(255,255,255,.6)">${esc(s.who)}</div><div id="qt" class="qt">${hide?'🎧 ouça a pergunta':''}</div>${ST.lvl===1?`<div class="ptx">${esc(q.pt)}</div>`:`<button class="lnk" id="spt">ver tradução</button>`}</div></div>
  <div class="row" style="justify-content:center;margin-top:8px"><button class="btn sm" id="rp">🔊 Repetir</button><button class="btn sm" id="sl">🐢 Devagar</button>${hide?'<button class="btn sm" id="sh">👁 Mostrar texto</button>':''}</div></div>
  <div class="card ansbox"><textarea id="ans" rows="3" placeholder="Responda em inglês… fale no 🎤 ou digite"></textarea><div class="row sp" style="margin-top:8px"><button class="btn" id="mic">🎤 Falar</button><div class="row" style="gap:6px">${mode==='treino'?'<button class="btn sm" id="hn">💡 Dica</button><button class="btn sm" id="md">📝 Modelo</button>':''}<button class="btn pri" id="snd">Responder →</button></div></div><div id="hx"></div></div>`;
  const qt=$('#qt');if(!hide){let k=0;const tw=setInterval(()=>{if(!qt.isConnected)return clearInterval(tw);qt.textContent=q.q.slice(0,++k);if(k>=q.q.length)clearInterval(tw)},24)}
  setTimeout(()=>talk(q.q,rate),250);$('#rp').onclick=()=>talk(q.q,rate);$('#sl').onclick=()=>talk(q.q,.65);
  const sh=$('#sh');if(sh)sh.onclick=()=>{qt.textContent=q.q;sh.remove()};const sp=$('#spt');if(sp)sp.onclick=()=>{sp.outerHTML=`<div class="ptx">${esc(q.pt)}</div>`};
  const ta=$('#ans');$('#mic').onclick=()=>listen($('#mic'),ta);
  const hn=$('#hn');if(hn)hn.onclick=()=>{$('#hx').innerHTML=`<div class="ph">💡 ${esc(q.tip)}</div>`};
  const md=$('#md');if(md)md.onclick=()=>{$('#hx').innerHTML=`<div class="ph">📝 ${esc(q.model)} ${spk(q.model)}</div>`};
  $('#snd').onclick=()=>{if(REC)REC.stop();const a=ta.value.trim();const ev=evalAns(q,a);res.push({q,a,...ev});feedback(ev)}};
 const feedback=ev=>{const q=s.qs[i],good=ev.score>=70;sfx(good?'ok':'bad');const av=$('#av');if(av)av.textContent=good?'🙂':'🤨';
  const col=ev.score>=70?'var(--ok)':ev.score>=45?'var(--warn)':'var(--bad)';
  $('#hx').innerHTML=`<div class="fbk"><div class="sring" style="--p:${ev.score};--col:${col}"><b>${ev.score}</b></div><div style="flex:1">${ev.items.map(([k,l])=>`<div class="fi ${k}">${k==='ok'?'✅':k==='warn'?'⚠️':k==='flag'?'🚩':'❌'} ${esc(l)}</div>`).join('')}</div></div>
  <div class="ph"><div class="mono">resposta modelo</div>${esc(q.model)} ${spk(q.model)}<div class="mut sm" style="margin-top:6px">💡 ${esc(q.tip)}</div></div><button class="btn pri big" id="nx" style="width:100%;margin-top:10px">${i+1<s.qs.length?'Próxima pergunta →':'Ver resultado'}</button>`;
  A().querySelectorAll('#snd,#mic,#hn,#md').forEach(b=>b.disabled=true);$('#nx').onclick=()=>{i++;i<s.qs.length?ask():report()}};
 const report=()=>{const avg=Math.round(res.reduce((a,r)=>a+r.score,0)/res.length),flags=res.some(r=>r.flag),ok=avg>=s.pass&&!flags;played(s.id);addXP(10+Math.round(avg/5));const rec=best(s.id,avg);
  const goods=[...new Set(res.flatMap(r=>r.items.filter(x=>x[0]==='ok'&&!/Tamanho/.test(x[1])).map(x=>x[1])))].slice(0,5),bads=[...new Set(res.flatMap(r=>r.items.filter(x=>x[0]!=='ok').map(x=>x[1])))].slice(0,6);
  A().innerHTML=`${head(s)}<div class="stage card"><div class="mono">resultado</div><div class="stamp ${ok?'ok':'no'}">${esc(ok?s.ok:s.bad)}</div><div class="word">${avg}<small style="font-size:16px;color:var(--tx3)">/100</small></div>${rec?'<p style="color:var(--warn)">novo recorde! 🏆</p>':''}
  ${flags?'<p class="bad-msg">🚩 Você usou uma resposta de risco. Veja abaixo.</p>':''}
  <div style="text-align:left">${goods.length?`<div class="mono" style="margin-top:10px">mandou bem</div>${goods.map(x=>`<div class="fi ok">✅ ${esc(x)}</div>`).join('')}`:''}${bads.length?`<div class="mono" style="margin-top:10px">pra treinar</div>${bads.map(x=>`<div class="fi bad">🎯 ${esc(x)}</div>`).join('')}`:''}
  <div class="mono" style="margin-top:12px">pergunta por pergunta</div>${res.map(r=>`<details class="rq"><summary><b style="color:${r.score>=70?'var(--ok)':r.score>=45?'var(--warn)':'var(--bad)'}">${r.score}</b> ${esc(r.q.q)}</summary><div class="mut sm">Você: “${esc(r.a||'—')}”</div><div class="sm">Modelo: ${esc(r.q.model)} ${spk(r.q.model)}</div></details>`).join('')}</div>
  <div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri big" id="ag">Treinar de novo</button><button class="btn big" onclick="location.hash=''">Outras simulações</button></div></div>`;
  $('#ag').onclick=intro;if(ok)celebrate(true);else sfx('bad')};
 window.CLEAN=()=>{if(REC)REC.stop()};intro()}
